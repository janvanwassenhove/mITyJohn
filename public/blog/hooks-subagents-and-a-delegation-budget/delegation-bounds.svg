<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"
     aria-label="Delegation bounds. The main loop may spawn a sub-agent. The sub-agent runs with a read-only allowlist enforced in the tool path, a budget of six rounds, and no onward delegation, so the tree is exactly two levels deep. It returns a summary; only the main loop may reach the approval gate and the outside world.">
  <defs>
    <pattern id="g3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#c9b998" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34302b"/>
    </marker>
    <marker id="a3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0522d"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#f4efe3"/>
  <rect width="1200" height="620" fill="url(#g3)"/>
  <rect x="14" y="14" width="1172" height="592" fill="none" stroke="#b8933f" stroke-width="1.2"/>
  <rect x="22" y="22" width="1156" height="576" fill="none" stroke="#b8933f" stroke-width="0.6" opacity="0.6"/>

  <text x="52" y="66" font-family="Consolas, ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#8a7a55">FIG. 1 — WHAT A DELEGATED AGENT MAY REACH</text>

  <!-- level 1 -->
  <text x="52" y="112" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#8a7a55">LEVEL 1</text>
  <rect x="52" y="126" width="330" height="128" fill="#efe7d6" stroke="#34302b" stroke-width="2.5"/>
  <text x="76" y="158" font-family="Consolas, ui-monospace, monospace" font-size="17" fill="#34302b">MAIN LOOP</text>
  <text x="76" y="188" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">may read</text>
  <text x="76" y="210" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">may write — with approval</text>
  <text x="76" y="232" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">may delegate</text>

  <!-- delegate arrow -->
  <line x1="382" y1="190" x2="470" y2="190" stroke="#34302b" stroke-width="2" marker-end="url(#a3)"/>
  <text x="426" y="176" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#8a7a55">delegate</text>

  <!-- level 2 -->
  <text x="470" y="112" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#8a7a55">LEVEL 2</text>
  <rect x="470" y="126" width="330" height="128" fill="#efe7d6" stroke="#34302b" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="494" y="158" font-family="Consolas, ui-monospace, monospace" font-size="17" fill="#34302b">SUB-AGENT</text>
  <text x="494" y="188" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">may read</text>
  <text x="494" y="210" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c0522d">may NOT write, ever</text>
  <text x="494" y="232" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c0522d">may NOT delegate</text>

  <!-- returns -->
  <path d="M635 254 L635 292 L217 292 L217 256" fill="none" stroke="#34302b" stroke-width="2" marker-end="url(#a3)"/>
  <text x="426" y="284" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#8a7a55">returns a summary, not a context</text>

  <!-- level 3 refused -->
  <text x="888" y="112" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#8a7a55">LEVEL 3</text>
  <line x1="800" y1="190" x2="878" y2="190" stroke="#c0522d" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="888" y="126" width="260" height="128" fill="#f6e5dc" stroke="#c0522d" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="912" y1="150" x2="1124" y2="232" stroke="#c0522d" stroke-width="1.5"/>
  <line x1="1124" y1="150" x2="912" y2="232" stroke="#c0522d" stroke-width="1.5"/>
  <rect x="898" y="166" width="240" height="52" fill="#f6e5dc"/>
  <text x="1018" y="187" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#c0522d">does not exist</text>
  <text x="1018" y="211" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c0522d">by construction</text>

  <!-- the three bounds -->
  <line x1="52" y1="340" x2="1148" y2="340" stroke="#b8933f" stroke-width="1"/>
  <text x="52" y="374" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#8a7a55">THE THREE BOUNDS ON A SUB-AGENT</text>

  <rect x="52" y="392" width="340" height="130" fill="#efe7d6" stroke="#34302b" stroke-width="1.5"/>
  <text x="72" y="424" font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#34302b">1 · READ-ONLY ALLOWLIST</text>
  <text x="72" y="452" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">checked in the tool path,</text>
  <text x="72" y="474" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">not asked of the prompt</text>
  <text x="72" y="502" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c0522d">refused even if the mode allows it</text>

  <rect x="430" y="392" width="340" height="130" fill="#efe7d6" stroke="#34302b" stroke-width="1.5"/>
  <text x="450" y="424" font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#34302b">2 · ROUND BUDGET</text>
  <text x="450" y="452" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">six rounds, then it returns</text>
  <text x="450" y="474" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">whatever it has</text>
  <text x="450" y="502" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c0522d">no "just one more look"</text>

  <rect x="808" y="392" width="340" height="130" fill="#efe7d6" stroke="#34302b" stroke-width="1.5"/>
  <text x="828" y="424" font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#34302b">3 · DEPTH LIMIT</text>
  <text x="828" y="452" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">the tree is two levels,</text>
  <text x="828" y="474" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">always</text>
  <text x="828" y="502" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c0522d">unbounded depth is unaccountable</text>

  <text x="600" y="568" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="13" letter-spacing="1" fill="#8a7a55">every mechanism here is a bound, not a capability</text>
</svg>

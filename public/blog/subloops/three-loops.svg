<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img"
     aria-label="Three loops on three clocks. Perception runs continuously against the camera. Conversation is event-driven and passes through idle, listening, transcribing, thinking and speaking, with interrupted as a state of its own. Maintenance runs every five minutes. The camera is shared between perception and gesture detection, and the speaker feeds back into the microphone, which is where the composition bugs live.">
  <defs>
    <pattern id="g4" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#c9b998" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34302b"/>
    </marker>
    <marker id="a4r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0522d"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#f4efe3"/>
  <rect width="1200" height="600" fill="url(#g4)"/>
  <rect x="14" y="14" width="1172" height="572" fill="none" stroke="#b8933f" stroke-width="1.2"/>
  <rect x="22" y="22" width="1156" height="556" fill="none" stroke="#b8933f" stroke-width="0.6" opacity="0.6"/>

  <text x="52" y="66" font-family="Consolas, ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#8a7a55">FIG. 1 — THREE LOOPS, THREE CLOCKS</text>

  <!-- perception -->
  <rect x="52" y="100" width="300" height="200" fill="#efe7d6" stroke="#34302b" stroke-width="2"/>
  <text x="72" y="132" font-family="Consolas, ui-monospace, monospace" font-size="16" fill="#34302b">PERCEPTION</text>
  <text x="72" y="156" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#c0522d">CONTINUOUS</text>
  <text x="72" y="188" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">frame → downscale →</text>
  <text x="72" y="210" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">embedding → match</text>
  <text x="72" y="248" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#34302b">knowing who walked in is</text>
  <text x="72" y="268" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#34302b">not a reply to a question</text>

  <!-- conversation -->
  <rect x="382" y="100" width="436" height="200" fill="#efe7d6" stroke="#34302b" stroke-width="2"/>
  <text x="402" y="132" font-family="Consolas, ui-monospace, monospace" font-size="16" fill="#34302b">CONVERSATION</text>
  <text x="402" y="156" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#c0522d">EVENT-DRIVEN</text>

  <g font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#34302b">
    <rect x="402" y="176" width="66" height="30" fill="#f4efe3" stroke="#34302b" stroke-width="1.2"/>
    <text x="435" y="196" text-anchor="middle">IDLE</text>
    <rect x="486" y="176" width="86" height="30" fill="#f4efe3" stroke="#34302b" stroke-width="1.2"/>
    <text x="529" y="196" text-anchor="middle">LISTENING</text>
    <rect x="590" y="176" width="104" height="30" fill="#f4efe3" stroke="#34302b" stroke-width="1.2"/>
    <text x="642" y="196" text-anchor="middle">TRANSCRIBING</text>
    <rect x="712" y="176" width="86" height="30" fill="#f4efe3" stroke="#34302b" stroke-width="1.2"/>
    <text x="755" y="196" text-anchor="middle">THINKING</text>
  </g>
  <line x1="468" y1="191" x2="484" y2="191" stroke="#34302b" stroke-width="1.4" marker-end="url(#a4)"/>
  <line x1="572" y1="191" x2="588" y2="191" stroke="#34302b" stroke-width="1.4" marker-end="url(#a4)"/>
  <line x1="694" y1="191" x2="710" y2="191" stroke="#34302b" stroke-width="1.4" marker-end="url(#a4)"/>

  <rect x="590" y="228" width="104" height="30" fill="#f4efe3" stroke="#34302b" stroke-width="1.2"/>
  <text x="642" y="248" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#34302b">SPEAKING</text>
  <path d="M755 206 L755 243 L696 243" fill="none" stroke="#34302b" stroke-width="1.4" marker-end="url(#a4)"/>

  <path d="M642 258 L642 282 L398 282 L398 191 L400 191" fill="none" stroke="#34302b" stroke-width="1.4" marker-end="url(#a4)"/>
  <rect x="534" y="272" width="42" height="18" fill="#efe7d6"/>
  <text x="555" y="286" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="10" fill="#8a7a55">done</text>

  <rect x="410" y="228" width="112" height="30" fill="#f6e5dc" stroke="#c0522d" stroke-width="1.6"/>
  <text x="466" y="248" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#c0522d">INTERRUPTED</text>
  <line x1="588" y1="243" x2="524" y2="243" stroke="#c0522d" stroke-width="1.4" marker-end="url(#a4r)"/>
  <path d="M466 228 L466 210 L435 210" fill="none" stroke="#c0522d" stroke-width="1.4" marker-end="url(#a4r)"/>

  <!-- maintenance -->
  <rect x="848" y="100" width="300" height="200" fill="#efe7d6" stroke="#34302b" stroke-width="2"/>
  <text x="868" y="132" font-family="Consolas, ui-monospace, monospace" font-size="16" fill="#34302b">MAINTENANCE</text>
  <text x="868" y="156" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#c0522d">EVERY 5 MINUTES</text>
  <text x="868" y="188" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">robot reachable?</text>
  <text x="868" y="210" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">key valid? store encrypted?</text>
  <text x="868" y="248" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#34302b">reconnects by itself —</text>
  <text x="868" y="268" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#34302b">and reports that it did</text>

  <!-- where the bugs live -->
  <line x1="52" y1="346" x2="1148" y2="346" stroke="#b8933f" stroke-width="1"/>
  <text x="52" y="380" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#8a7a55">THE BUGS ARE NOT IN THE LOOPS — THEY ARE BETWEEN THEM</text>

  <rect x="52" y="400" width="520" height="150" fill="#efe7d6" stroke="#34302b" stroke-width="1.5"/>
  <text x="74" y="432" font-family="Consolas, ui-monospace, monospace" font-size="14" fill="#34302b">SHARED HARDWARE</text>
  <text x="74" y="460" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">face recognition and gesture detection</text>
  <text x="74" y="482" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">both want the same camera frame</text>
  <text x="74" y="516" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c0522d">→ one shared frame, short time-to-live</text>

  <rect x="628" y="400" width="520" height="150" fill="#efe7d6" stroke="#34302b" stroke-width="1.5"/>
  <text x="650" y="432" font-family="Consolas, ui-monospace, monospace" font-size="14" fill="#34302b">OUTPUT BECOMES INPUT</text>
  <text x="650" y="460" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">the speaker is next to the microphone,</text>
  <text x="650" y="482" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#6f6659">joined by the air in the room</text>
  <text x="650" y="516" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c0522d">→ gate where the loop closes</text>
</svg>

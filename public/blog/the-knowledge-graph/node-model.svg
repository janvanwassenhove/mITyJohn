<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img"
     aria-label="The graph model. Four node types: a person, the facts belonging to that person, the topics those facts mention, and skills which belong either to a person or to everyone. Topics are not entered by anyone; they come into existence because a fact mentioned them. Deleting a person destroys their key, so their facts and every edge from them disappear.">
  <defs>
    <pattern id="g5" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#c9b998" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a7a55"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#f4efe3"/>
  <rect width="1200" height="600" fill="url(#g5)"/>
  <rect x="14" y="14" width="1172" height="572" fill="none" stroke="#b8933f" stroke-width="1.2"/>
  <rect x="22" y="22" width="1156" height="556" fill="none" stroke="#b8933f" stroke-width="0.6" opacity="0.6"/>

  <text x="52" y="66" font-family="Consolas, ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#8a7a55">FIG. 2 — FOUR NODE TYPES</text>

  <!-- edges first -->
  <g stroke="#8a7a55" stroke-width="1.4" fill="none">
    <line x1="288" y1="250" x2="420" y2="180" marker-end="url(#a5)"/>
    <line x1="288" y1="266" x2="420" y2="266" marker-end="url(#a5)"/>
    <line x1="288" y1="282" x2="420" y2="352" marker-end="url(#a5)"/>
    <line x1="560" y1="180" x2="700" y2="150" marker-end="url(#a5)"/>
    <line x1="560" y1="190" x2="700" y2="248" marker-end="url(#a5)"/>
    <line x1="560" y1="266" x2="700" y2="248" marker-end="url(#a5)"/>
    <line x1="560" y1="352" x2="700" y2="350" marker-end="url(#a5)"/>
    <line x1="560" y1="362" x2="700" y2="248" marker-end="url(#a5)"/>
    <line x1="230" y1="316" x2="230" y2="404" marker-end="url(#a5)"/>
  </g>

  <!-- person -->
  <circle cx="230" cy="266" r="58" fill="#34302b"/>
  <text x="230" y="262" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#f4efe3">PERSON</text>
  <text x="230" y="282" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#c9b998">has a key</text>

  <!-- facts -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#34302b">
    <rect x="420" y="160" width="140" height="38" fill="#efe7d6" stroke="#34302b" stroke-width="1.6"/>
    <text x="490" y="184" text-anchor="middle">FACT · sport</text>
    <rect x="420" y="247" width="140" height="38" fill="#efe7d6" stroke="#34302b" stroke-width="1.6"/>
    <text x="490" y="271" text-anchor="middle">FACT · likes</text>
    <rect x="420" y="333" width="140" height="38" fill="#efe7d6" stroke="#34302b" stroke-width="1.6"/>
    <text x="490" y="357" text-anchor="middle">FACT · habit</text>
  </g>

  <!-- topics -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#34302b">
    <circle cx="732" cy="150" r="32" fill="#efe7d6" stroke="#8a7a55" stroke-width="1.6"/>
    <text x="732" y="154" text-anchor="middle" font-size="11">running</text>
    <circle cx="732" cy="248" r="36" fill="#efe7d6" stroke="#8a7a55" stroke-width="1.6"/>
    <text x="732" y="252" text-anchor="middle" font-size="11">espresso</text>
    <circle cx="732" cy="350" r="32" fill="#efe7d6" stroke="#8a7a55" stroke-width="1.6"/>
    <text x="732" y="354" text-anchor="middle" font-size="11">Java 21</text>
  </g>
  <text x="800" y="248" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#c0522d">shared topics are the</text>
  <text x="800" y="268" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#c0522d">cheapest possible context</text>

  <!-- skill -->
  <rect x="160" y="404" width="140" height="44" fill="#efe7d6" stroke="#34302b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="230" y="431" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#34302b">SKILL</text>
  <text x="316" y="422" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#6f6659">belongs to one person,</text>
  <text x="316" y="442" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#6f6659">or to everybody</text>

  <!-- legend / notes -->
  <line x1="52" y1="484" x2="1148" y2="484" stroke="#b8933f" stroke-width="1"/>
  <text x="52" y="514" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#34302b">Topics are never entered by anyone. They exist because a fact mentioned them —</text>
  <text x="52" y="536" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#34302b">so the vocabulary is emergent rather than designed.</text>
  <text x="52" y="564" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c0522d">Delete the person and the key goes with them: no key, no facts, no edges.</text>
</svg>

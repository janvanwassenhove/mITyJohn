<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"
     aria-label="Envelope encryption. A passphrase derives an owner key, which is never stored. The owner key wraps one key per person. Each person's key encrypts only that person's records. Destroying one person's key makes their records unreadable ciphertext. Rotating the owner key re-wraps the small keys and never touches the records.">
  <defs>
    <pattern id="g6" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#c9b998" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34302b"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#f4efe3"/>
  <rect width="1200" height="620" fill="url(#g6)"/>
  <rect x="14" y="14" width="1172" height="592" fill="none" stroke="#b8933f" stroke-width="1.2"/>
  <rect x="22" y="22" width="1156" height="576" fill="none" stroke="#b8933f" stroke-width="0.6" opacity="0.6"/>

  <text x="52" y="66" font-family="Consolas, ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#8a7a55">FIG. 1 — THE ENVELOPE</text>

  <!-- passphrase -->
  <rect x="52" y="110" width="200" height="70" fill="#efe7d6" stroke="#34302b" stroke-width="2"/>
  <text x="152" y="142" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="14" fill="#34302b">PASSPHRASE</text>
  <text x="152" y="164" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#6f6659">in the OS keyring</text>

  <line x1="252" y1="145" x2="322" y2="145" stroke="#34302b" stroke-width="2" marker-end="url(#a6)"/>
  <text x="287" y="132" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#8a7a55">derive</text>

  <!-- owner key -->
  <rect x="322" y="110" width="210" height="70" fill="#34302b"/>
  <text x="427" y="142" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="14" fill="#f4efe3">OWNER KEY</text>
  <text x="427" y="164" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#c0522d">never stored</text>

  <!-- wraps -->
  <path d="M427 180 L427 216 L230 216 L230 250" fill="none" stroke="#34302b" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M427 180 L427 216 L560 216 L560 250" fill="none" stroke="#34302b" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M427 180 L427 216 L890 216 L890 250" fill="none" stroke="#34302b" stroke-width="2" marker-end="url(#a6)"/>
  <text x="600" y="208" font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#8a7a55">wraps one key per person</text>

  <!-- person columns -->
  <g font-family="Consolas, ui-monospace, monospace">
    <rect x="140" y="252" width="180" height="52" fill="#efe7d6" stroke="#34302b" stroke-width="1.8"/>
    <text x="230" y="284" text-anchor="middle" font-size="13" fill="#34302b">KEY · person A</text>
    <rect x="470" y="252" width="180" height="52" fill="#efe7d6" stroke="#34302b" stroke-width="1.8"/>
    <text x="560" y="284" text-anchor="middle" font-size="13" fill="#34302b">KEY · person B</text>
    <rect x="800" y="252" width="180" height="52" fill="#f6e5dc" stroke="#c0522d" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="890" y="284" text-anchor="middle" font-size="13" fill="#c0522d">KEY · destroyed</text>
  </g>

  <line x1="230" y1="304" x2="230" y2="348" stroke="#34302b" stroke-width="2" marker-end="url(#a6)"/>
  <line x1="560" y1="304" x2="560" y2="348" stroke="#34302b" stroke-width="2" marker-end="url(#a6)"/>
  <line x1="890" y1="304" x2="890" y2="348" stroke="#c0522d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a6)"/>

  <g font-family="Consolas, ui-monospace, monospace">
    <rect x="140" y="350" width="180" height="86" fill="#efe7d6" stroke="#34302b" stroke-width="1.8"/>
    <text x="230" y="382" text-anchor="middle" font-size="12" fill="#34302b">A's records</text>
    <text x="230" y="404" text-anchor="middle" font-size="11" fill="#6f6659">facts · signals</text>
    <text x="230" y="424" text-anchor="middle" font-size="11" fill="#6f6659">embeddings</text>

    <rect x="470" y="350" width="180" height="86" fill="#efe7d6" stroke="#34302b" stroke-width="1.8"/>
    <text x="560" y="382" text-anchor="middle" font-size="12" fill="#34302b">B's records</text>
    <text x="560" y="404" text-anchor="middle" font-size="11" fill="#6f6659">facts · signals</text>
    <text x="560" y="424" text-anchor="middle" font-size="11" fill="#6f6659">embeddings</text>

    <rect x="800" y="350" width="180" height="86" fill="#e8e2d6" stroke="#8a7a55" stroke-width="1.5"/>
    <text x="890" y="386" text-anchor="middle" font-size="12" fill="#8a7a55">ciphertext</text>
    <text x="890" y="410" text-anchor="middle" font-size="12" fill="#8a7a55">nobody can read</text>
  </g>

  <line x1="52" y1="474" x2="1148" y2="474" stroke="#b8933f" stroke-width="1"/>
  <text x="52" y="506" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#34302b">Deleting a person destroys their key. Their records remain on disk as ciphertext</text>
  <text x="52" y="528" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#34302b">that nothing can open — erasure as physics rather than as a promise.</text>
  <text x="52" y="562" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c0522d">Rotating the owner key re-wraps three small keys. The records are never touched.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-label="Architecture of HockeyEleven. Five things drive the match: you with keyboard, touch or gamepad; the opening reel, which is nobody but a seed and the team AI; Learn to play, a script on a virtual pad; online play, two people in lockstep; and the tests, which play full matches in every format. All of them feed one component, the match: a fixed step of one sixtieth of a second, seeded, with bit-identical maths and no pixels, holding rules, team AI, ball physics, squads and fitness, nations and clubs, and tournaments. Its state goes read-only every frame to what you see: the rig, then people, then the scene, then the picture in three.js. The Academy uses the same rig and people but its own renderer and no running match. A workshop of offline tools produces gait, movement, the human base and far cuts; only the numbers ship. Everything is static files on Cloudflare Pages, installable and playable offline, with an account needed only for online, Career and Academy." font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3b4c4"/></marker><marker id="al" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c6f368"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb454"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8aa2ff"/></marker></defs>
<rect width="1000" height="830" fill="#101b28"/>
<text x="30" y="40" font-size="14" font-weight="700" fill="#a3b4c4" text-anchor="start" letter-spacing="1.5">WHO DRIVES THE MATCH</text><rect x="30" y="54" width="180" height="104" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="44" y="84" font-size="18" font-weight="700" fill="#f3f4eb" text-anchor="start">You</text><text x="44" y="110" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">keyboard, touch,</text><text x="44" y="130" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">gamepad</text><line x1="120" y1="158" x2="120" y2="206" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="220" y="54" width="180" height="104" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="234" y="84" font-size="18" font-weight="700" fill="#f3f4eb" text-anchor="start">Opening reel</text><text x="234" y="110" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">nobody: a seed</text><text x="234" y="130" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">and the team AI</text><line x1="310" y1="158" x2="310" y2="206" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="410" y="54" width="180" height="104" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="424" y="84" font-size="18" font-weight="700" fill="#f3f4eb" text-anchor="start">Learn to play</text><text x="424" y="110" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">a script on a</text><text x="424" y="130" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">virtual pad</text><line x1="500" y1="158" x2="500" y2="206" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="600" y="54" width="180" height="104" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="614" y="84" font-size="18" font-weight="700" fill="#f3f4eb" text-anchor="start">Online</text><text x="614" y="110" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">two people,</text><text x="614" y="130" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">in lockstep</text><line x1="690" y1="158" x2="690" y2="206" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="790" y="54" width="180" height="104" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="804" y="84" font-size="18" font-weight="700" fill="#f3f4eb" text-anchor="start">Tests</text><text x="804" y="110" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">full matches</text><text x="804" y="130" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">in every format</text><line x1="880" y1="158" x2="880" y2="206" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="30" y="210" width="940" height="176" rx="14" fill="#1f3147" stroke="#c6f368" stroke-width="2.5"/><text x="54" y="248" font-size="26" font-weight="800" fill="#c6f368" text-anchor="start">The match</text><text x="200" y="248" font-size="17" font-weight="400" fill="#f3f4eb" text-anchor="start">one step of 1/60 s · seeded · bit-identical maths · no pixels</text><rect x="54" y="272" width="140" height="46" rx="8" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="124" y="301" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="middle">Rules</text><rect x="204" y="272" width="140" height="46" rx="8" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="274" y="301" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="middle">Team AI</text><rect x="354" y="272" width="140" height="46" rx="8" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="424" y="301" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="middle">Ball physics</text><rect x="504" y="272" width="140" height="46" rx="8" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="574" y="301" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="middle">Squads, fitness</text><rect x="654" y="272" width="140" height="46" rx="8" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="724" y="301" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="middle">Nations, clubs</text><rect x="804" y="272" width="140" height="46" rx="8" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="874" y="301" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="middle">Tournaments</text><text x="54" y="354" font-size="16" font-weight="400" fill="#a3b4c4" text-anchor="start">Same seed and same inputs give the same match, on any machine, every time.</text><line x1="250" y1="386" x2="250" y2="444" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><text x="264" y="420" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">state, read-only, every frame</text><text x="30" y="432" font-size="14" font-weight="700" fill="#a3b4c4" text-anchor="start" letter-spacing="1.5">WHAT YOU SEE</text><rect x="30" y="446" width="220" height="104" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="44" y="476" font-size="18" font-weight="700" fill="#f3f4eb" text-anchor="start">Rig</text><text x="44" y="502" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">poses every joint</text><text x="44" y="522" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">from the state</text><line x1="250" y1="498" x2="270" y2="498" stroke="#a3b4c4" stroke-width="2" marker-end="url(#am)"/><rect x="270" y="446" width="220" height="104" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="284" y="476" font-size="18" font-weight="700" fill="#f3f4eb" text-anchor="start">People</text><text x="284" y="502" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">recipes, faces,</text><text x="284" y="522" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">hair, skirts</text><line x1="490" y1="498" x2="510" y2="498" stroke="#a3b4c4" stroke-width="2" marker-end="url(#am)"/><rect x="510" y="446" width="220" height="104" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="524" y="476" font-size="18" font-weight="700" fill="#f3f4eb" text-anchor="start">Scene</text><text x="524" y="502" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">grounds, crowd,</text><text x="524" y="522" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">broadcast camera</text><line x1="730" y1="498" x2="750" y2="498" stroke="#a3b4c4" stroke-width="2" marker-end="url(#am)"/><rect x="750" y="446" width="220" height="104" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="764" y="476" font-size="18" font-weight="700" fill="#f3f4eb" text-anchor="start">Picture</text><text x="764" y="502" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">three.js, WebGL,</text><text x="764" y="522" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">a quality ladder</text><rect x="30" y="596" width="450" height="134" rx="10" fill="#1f3147" stroke="#8aa2ff" stroke-width="2"/><text x="46" y="628" font-size="20" font-weight="800" fill="#8aa2ff" text-anchor="start">Academy</text><text x="46" y="656" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="start">Same players, same grounds, same rules data.</text><text x="46" y="677" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="start">Its own renderer, and no match running: skills</text><text x="46" y="698" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="start">play a motion, drills and tactics play a script.</text><path d="M100 596V552" fill="none" stroke="#8aa2ff" stroke-width="2" marker-end="url(#ab)" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 596V552" fill="none" stroke="#8aa2ff" stroke-width="2" marker-end="url(#ab)" stroke-linecap="round" stroke-linejoin="round"/><rect x="500" y="596" width="470" height="134" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5" stroke-dasharray="6 5"/><text x="516" y="628" font-size="20" font-weight="800" fill="#f3f4eb" text-anchor="start">The workshop, tools/</text><text x="516" y="656" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="start">Gait from motion capture, movement from video,</text><text x="516" y="677" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="start">the human base, far cuts. Runs on my machine;</text><text x="516" y="698" font-size="15" font-weight="400" fill="#f3f4eb" text-anchor="start">only the resulting numbers ship.</text><path d="M640 596V574H180V552" fill="none" stroke="#a3b4c4" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#am)" stroke-linecap="round" stroke-linejoin="round"/><path d="M730 596V566H420V552" fill="none" stroke="#a3b4c4" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#am)" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="752" width="940" height="50" rx="8" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="500" y="783" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="middle">Static files on Cloudflare Pages · installs and plays offline · an account only for online, Career and Academy</text>
</svg>

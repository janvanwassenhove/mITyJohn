<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 0 1000 478" role="img" aria-label="How a player gets a pose, in five panels from left to right. One: the state, a position, speed, heading and action, with no body at all. Two: gait, legs and torso from curves measured in motion capture and blended by ground speed. Three: planted feet, a foot on the turf stays put or the player skates. Four: a clip, a stroke slerped per bone over what is there, only on the parts it is about. Five: hands on stick, arms solved last onto the stick, which has the final word." font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

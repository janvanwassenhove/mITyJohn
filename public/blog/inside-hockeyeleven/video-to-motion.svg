<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Turning one clip into a movement. One clip of a person doing the skill properly goes to detect, which finds whole-body 2D keypoints, the stick and the ball. Fit solves the game’s skeleton frame by frame under priors: bone lengths, joint limits, planted feet, hands on the shaft, stick length, the head of the stick on the turf and the flat face towards the ball. Export writes one file of plain numbers. Overlay draws the engine through the solved camera on top of the clip and reports error per part. A gate checks body within 3 percent, hands within 4 percent, stick angle within 5 degrees, planted foot slide under 2 centimetres, balance within 5 centimetres past the feet, stick low point within 3 centimetres of the turf, ball within 4 centimetres of the face; failing goes back to the fit. Then you look at it from angles the camera never had, because a front-on clip hides depth. Only then is it switched on. Nothing of the video ships." font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3b4c4"/></marker><marker id="al" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c6f368"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb454"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8aa2ff"/></marker></defs>
<rect width="1000" height="620" fill="#101b28"/>
<rect x="30" y="40" width="220" height="132" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="44" y="72" font-size="19" font-weight="800" fill="#f3f4eb" text-anchor="start">One clip</text><text x="44" y="100" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">a person doing the</text><text x="44" y="121" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">skill properly,</text><text x="44" y="142" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">one repetition</text><line x1="250" y1="106" x2="270" y2="106" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="270" y="40" width="220" height="132" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="284" y="72" font-size="19" font-weight="800" fill="#f3f4eb" text-anchor="start">Detect</text><text x="284" y="100" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">whole-body 2D</text><text x="284" y="121" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">keypoints, the stick,</text><text x="284" y="142" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">the ball</text><line x1="490" y1="106" x2="510" y2="106" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="510" y="40" width="220" height="132" rx="10" fill="#1f3147" stroke="#c6f368" stroke-width="2.5"/><text x="524" y="72" font-size="19" font-weight="800" fill="#c6f368" text-anchor="start">Fit</text><text x="524" y="100" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">the game’s skeleton,</text><text x="524" y="121" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">frame by frame,</text><text x="524" y="142" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">under priors</text><line x1="730" y1="106" x2="750" y2="106" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="750" y="40" width="220" height="132" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="764" y="72" font-size="19" font-weight="800" fill="#f3f4eb" text-anchor="start">Export</text><text x="764" y="100" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">one file of plain</text><text x="764" y="121" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">numbers, per skill</text><text x="764" y="142" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">(no pixels)</text><rect x="30" y="206" width="620" height="86" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5" stroke-dasharray="6 5"/><text x="46" y="234" font-size="15" font-weight="700" fill="#f3f4eb" text-anchor="start">Priors: what the fit is not allowed to believe otherwise</text><text x="46" y="258" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">bone lengths · joint limits · planted feet · hands on the shaft</text><text x="46" y="278" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">stick length · stick head on the turf · flat face to the ball</text><path d="M590 206V174" fill="none" stroke="#a3b4c4" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#am)" stroke-linecap="round" stroke-linejoin="round"/><path d="M860 172V322" fill="none" stroke="#c6f368" stroke-width="2" marker-end="url(#al)" stroke-linecap="round" stroke-linejoin="round"/><rect x="690" y="324" width="280" height="132" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="704" y="356" font-size="19" font-weight="800" fill="#f3f4eb" text-anchor="start">Overlay</text><text x="704" y="384" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">the engine, drawn through</text><text x="704" y="405" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">the solved camera, on top</text><text x="704" y="426" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">of the clip; error per part</text><line x1="690" y1="390" x2="642" y2="390" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="290" y="324" width="350" height="216" rx="10" fill="#1f3147" stroke="#ffb454" stroke-width="2.5"/><text x="306" y="356" font-size="19" font-weight="800" fill="#ffb454" text-anchor="start">Gate</text><text x="306" y="384" font-size="14.5" font-weight="400" fill="#f3f4eb" text-anchor="start">body within 3% · hands within 4%</text><text x="306" y="407" font-size="14.5" font-weight="400" fill="#f3f4eb" text-anchor="start">stick angle within 5°</text><text x="306" y="430" font-size="14.5" font-weight="400" fill="#f3f4eb" text-anchor="start">planted foot slides under 2 cm</text><text x="306" y="453" font-size="14.5" font-weight="400" fill="#f3f4eb" text-anchor="start">balance within 5 cm past the feet</text><text x="306" y="476" font-size="14.5" font-weight="400" fill="#f3f4eb" text-anchor="start">stick low point within 3 cm of turf</text><text x="306" y="499" font-size="14.5" font-weight="400" fill="#f3f4eb" text-anchor="start">ball within 4 cm of the face</text><path d="M600 324V304H670V174" fill="none" stroke="#ffb454" stroke-width="2" marker-end="url(#aa)" stroke-linecap="round" stroke-linejoin="round"/><text x="476" y="316" font-size="14" font-weight="400" fill="#ffb454" text-anchor="start">fail: back to the fit</text><line x1="290" y1="430" x2="246" y2="430" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="30" y="324" width="214" height="216" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="46" y="356" font-size="19" font-weight="800" fill="#f3f4eb" text-anchor="start">Look at it</text><text x="46" y="384" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">from the angles</text><text x="46" y="405" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">the camera never</text><text x="46" y="426" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">had. A front-on clip</text><text x="46" y="447" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">hides depth; passing</text><text x="46" y="468" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">the numbers proves</text><text x="46" y="489" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">nothing yet.</text><path d="M137 540V566H702" fill="none" stroke="#c6f368" stroke-width="2" marker-end="url(#al)" stroke-linecap="round" stroke-linejoin="round"/><rect x="704" y="542" width="266" height="48" rx="10" fill="#1f3147" stroke="#c6f368" stroke-width="2.5"/><text x="837" y="572" font-size="18" font-weight="800" fill="#c6f368" text-anchor="middle">Switch it on</text><text x="30" y="600" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">Nothing of the video ships.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="One tick. Every browser frame, the elapsed time goes into an accumulator; while a step fits, match.step runs with one sixtieth of a second and the input, zero, one or several times; then the view draws once and reads the state, with nothing flowing back. Inside one step the order is fixed: calls such as tactic, plan, corner and pause; stoppages and restarts, then the clock; human actions; everybody moves through the team AI or your steering; contact, meaning separation, keep-off distance, stick blocks and keeper takes; the ball in 240 hertz substeps so a shot cannot tunnel through a keeper; strokes; and a snapshot into the replay buffer." font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3b4c4"/></marker><marker id="al" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c6f368"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb454"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8aa2ff"/></marker></defs>
<rect width="1000" height="560" fill="#101b28"/>
<text x="30" y="40" font-size="14" font-weight="700" fill="#a3b4c4" text-anchor="start" letter-spacing="1.5">EVERY BROWSER FRAME</text><rect x="30" y="56" width="300" height="92" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="46" y="86" font-size="17" font-weight="700" fill="#f3f4eb" text-anchor="start">Time since last frame</text><text x="46" y="112" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">goes into an accumulator</text><text x="46" y="132" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">(screens run at any rate)</text><line x1="180" y1="148" x2="180" y2="206" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/><rect x="30" y="210" width="300" height="108" rx="10" fill="#1f3147" stroke="#c6f368" stroke-width="2.5"/><text x="46" y="240" font-size="17" font-weight="700" fill="#f3f4eb" text-anchor="start">While a step fits:</text><text x="46" y="268" font-size="17" font-weight="700" fill="#c6f368" text-anchor="start">match.step(1/60, input)</text><text x="46" y="294" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">zero, one or several times</text><line x1="180" y1="318" x2="180" y2="376" stroke="#a3b4c4" stroke-width="2" marker-end="url(#am)"/><rect x="30" y="380" width="300" height="92" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="46" y="410" font-size="17" font-weight="700" fill="#f3f4eb" text-anchor="start">Then draw, once</text><text x="46" y="436" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">the view reads the state;</text><text x="46" y="456" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="start">nothing flows back</text><path d="M30 426H14V102H28" fill="none" stroke="#a3b4c4" stroke-width="2" marker-end="url(#am)" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="40" font-size="14" font-weight="700" fill="#a3b4c4" text-anchor="start" letter-spacing="1.5">INSIDE ONE STEP, ALWAYS IN THIS ORDER</text><rect x="380" y="56" width="590" height="52" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="398" y="89" font-size="18" font-weight="800" fill="#c6f368" text-anchor="start">1</text><text x="426" y="79" font-size="16" font-weight="700" fill="#f3f4eb" text-anchor="start">Calls</text><text x="426" y="99" font-size="14" font-weight="400" fill="#a3b4c4" text-anchor="start">tactic, plan, corner, pause: they travel with the inputs</text><rect x="380" y="116" width="590" height="52" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="398" y="149" font-size="18" font-weight="800" fill="#c6f368" text-anchor="start">2</text><text x="426" y="139" font-size="16" font-weight="700" fill="#f3f4eb" text-anchor="start">Stoppages</text><text x="426" y="159" font-size="14" font-weight="400" fill="#a3b4c4" text-anchor="start">whistles and restarts come first; the clock only then</text><rect x="380" y="176" width="590" height="52" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="398" y="209" font-size="18" font-weight="800" fill="#c6f368" text-anchor="start">3</text><text x="426" y="199" font-size="16" font-weight="700" fill="#f3f4eb" text-anchor="start">Human actions</text><text x="426" y="219" font-size="14" font-weight="400" fill="#a3b4c4" text-anchor="start">switch, pass, through ball, lift, shot, tackle, block</text><rect x="380" y="236" width="590" height="52" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="398" y="269" font-size="18" font-weight="800" fill="#c6f368" text-anchor="start">4</text><text x="426" y="259" font-size="16" font-weight="700" fill="#f3f4eb" text-anchor="start">Everybody moves</text><text x="426" y="279" font-size="14" font-weight="400" fill="#a3b4c4" text-anchor="start">each player gets the team AI, or your steering</text><rect x="380" y="296" width="590" height="52" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="398" y="329" font-size="18" font-weight="800" fill="#c6f368" text-anchor="start">5</text><text x="426" y="319" font-size="16" font-weight="700" fill="#f3f4eb" text-anchor="start">Contact</text><text x="426" y="339" font-size="14" font-weight="400" fill="#a3b4c4" text-anchor="start">separation, keep-off distance, stick blocks, keeper takes</text><rect x="380" y="356" width="590" height="52" rx="10" fill="#1f3147" stroke="#c6f368" stroke-width="1.5"/><text x="398" y="389" font-size="18" font-weight="800" fill="#c6f368" text-anchor="start">6</text><text x="426" y="379" font-size="16" font-weight="700" fill="#f3f4eb" text-anchor="start">Ball</text><text x="426" y="399" font-size="14" font-weight="400" fill="#a3b4c4" text-anchor="start">240 Hz substeps, so a shot cannot tunnel through a keeper</text><rect x="380" y="416" width="590" height="52" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="398" y="449" font-size="18" font-weight="800" fill="#c6f368" text-anchor="start">7</text><text x="426" y="439" font-size="16" font-weight="700" fill="#f3f4eb" text-anchor="start">Strokes</text><text x="426" y="459" font-size="14" font-weight="400" fill="#a3b4c4" text-anchor="start">each player’s swing moves on by one step</text><rect x="380" y="476" width="590" height="52" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="398" y="509" font-size="18" font-weight="800" fill="#c6f368" text-anchor="start">8</text><text x="426" y="499" font-size="16" font-weight="700" fill="#f3f4eb" text-anchor="start">Snapshot</text><text x="426" y="519" font-size="14" font-weight="400" fill="#a3b4c4" text-anchor="start">into the replay buffer</text><path d="M332 264H356V82" fill="none" stroke="#c6f368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="356" y1="82" x2="378" y2="82" stroke="#c6f368" stroke-width="2" marker-end="url(#al)"/>
</svg>

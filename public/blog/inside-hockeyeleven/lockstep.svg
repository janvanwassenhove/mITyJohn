<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="Online play in lockstep. Host and guest both run the whole match from the same seed. Tick N only runs once both inputs for N are known; your own input is scheduled a few ticks ahead so it usually is. Nobody sends positions, the ball or the score. Between them travel inputs of nine bytes, every other tick with the last eight ticks repeated against loss, and a checksum every thirty ticks. On a mismatch the host sends a snapshot and the guest continues from it. The link is direct over WebRTC when the two can connect, with the session Realtime channel as relay when they cannot." font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3b4c4"/></marker><marker id="al" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c6f368"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb454"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8aa2ff"/></marker></defs>
<rect width="1000" height="390" fill="#101b28"/>
<rect x="30" y="30" width="230" height="270" rx="10" fill="#1f3147" stroke="#c6f368" stroke-width="2"/><text x="145" y="66" font-size="20" font-weight="800" fill="#f3f4eb" text-anchor="middle">Host</text><rect x="52" y="84" width="186" height="70" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="145" y="114" font-size="16" font-weight="700" fill="#f3f4eb" text-anchor="middle">The whole match</text><text x="145" y="138" font-size="14" font-weight="400" fill="#a3b4c4" text-anchor="middle">same seed</text><text x="52" y="190" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">Tick N only runs once</text><text x="52" y="210" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">both inputs for N are</text><text x="52" y="230" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">here. Your own input is</text><text x="52" y="250" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">scheduled a few ticks</text><text x="52" y="270" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">ahead, so it usually is.</text><rect x="740" y="30" width="230" height="270" rx="10" fill="#1f3147" stroke="#c6f368" stroke-width="2"/><text x="855" y="66" font-size="20" font-weight="800" fill="#f3f4eb" text-anchor="middle">Guest</text><rect x="762" y="84" width="186" height="70" rx="10" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="855" y="114" font-size="16" font-weight="700" fill="#f3f4eb" text-anchor="middle">The whole match</text><text x="855" y="138" font-size="14" font-weight="400" fill="#a3b4c4" text-anchor="middle">same seed</text><text x="762" y="190" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">Nobody sends positions,</text><text x="762" y="210" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">the ball or the score.</text><text x="762" y="230" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">Each side computes</text><text x="762" y="250" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">them, and they agree</text><text x="762" y="270" font-size="14.5" font-weight="400" fill="#a3b4c4" text-anchor="start">because the maths does.</text><text x="500" y="60" font-size="16" font-weight="700" fill="#c6f368" text-anchor="middle">Inputs, nine bytes</text><text x="500" y="94" font-size="13.5" font-weight="400" fill="#a3b4c4" text-anchor="middle">every other tick, with the last eight ticks repeated against loss</text><line x1="268" y1="72" x2="732" y2="72" stroke="#c6f368" stroke-width="2.5" marker-end="url(#al)" marker-start="url(#al)"/><text x="500" y="148" font-size="16" font-weight="700" fill="#c6f368" text-anchor="middle">Checksum</text><text x="500" y="182" font-size="13.5" font-weight="400" fill="#a3b4c4" text-anchor="middle">every thirty ticks</text><line x1="268" y1="160" x2="732" y2="160" stroke="#c6f368" stroke-width="2.5" marker-end="url(#al)" marker-start="url(#al)"/><text x="500" y="236" font-size="16" font-weight="700" fill="#ffb454" text-anchor="middle">Snapshot, on a mismatch</text><line x1="266" y1="248" x2="732" y2="248" stroke="#ffb454" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#aa)"/><text x="500" y="270" font-size="13.5" font-weight="400" fill="#a3b4c4" text-anchor="middle">the guest continues from the host’s state</text><rect x="30" y="322" width="940" height="44" rx="8" fill="#182638" stroke="#3a5068" stroke-width="1.5"/><text x="500" y="350" font-size="15" font-weight="400" fill="#a3b4c4" text-anchor="middle">Direct over WebRTC when the two can connect; the session’s Realtime channel as relay when they cannot</text>
</svg>
